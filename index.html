  body::before{content:'';position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg, rgba(6,30,59,.5) 0%, rgba(6,30,59,.35) 40%, rgba(4,16,31,.72) 100%)}
  #page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 40px}

  /* MONEY LINE TICKER */
  #moneyStrip{position:sticky;top:0;z-index:50;margin:0 -16px;
    background:#000;border-bottom:2px solid #1F2226;
    font-family:var(--mono);font-weight:bold;font-size:14px;letter-spacing:.06em;
    color:var(--amber);text-shadow:0 0 7px rgba(255,176,32,.8);
    padding:9px 0;white-space:nowrap;overflow:hidden}
  #moneyInner{display:inline-block;padding-left:100%;animation:scroll 36s linear infinite}
  #moneyInner .pay{color:#FF453A;text-shadow:0 0 8px rgba(255,69,58,.9)}
  #moneyInner .gr{color:var(--ledgreen);text-shadow:0 0 7px rgba(67,255,107,.7)}
  @keyframes scroll{to{transform:translateX(-100%)}}

  /* HEADER */
  #header{display:flex;align-items:center;gap:16px;padding:18px 4px 10px;flex-wrap:wrap}
  #header img{height:54px;width:auto}
  #headTitle{flex:1;min-width:200px}
  #headTitle h1{font-family:var(--anton);font-size:clamp(22px,4vw,38px);letter-spacing:.06em;line-height:1;
    text-shadow:0 3px 14px rgba(0,0,0,.8)}
  #headTitle h1 span{color:var(--green)}
  #headTitle p{font-size:13px;color:#B9C7DC;letter-spacing:.15em}
  #updated{font-family:var(--mono);font-weight:bold;font-size:11px;color:var(--ledgreen);
    text-shadow:0 0 6px rgba(67,255,107,.6);text-align:right}
  #updated .err{color:#FF453A;text-shadow:0 0 8px rgba(255,69,58,.9)}

  /* PANELS */
  .shell{background:var(--panel);border-radius:10px;padding:12px;border:1px solid #000;
    box-shadow:0 16px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16);margin-top:18px}
  .shellTitle{display:flex;justify-content:space-between;align-items:center;padding:0 6px 9px}
  .shellTitle h2{font-family:var(--anton);font-size:clamp(14px,2vw,19px);letter-spacing:.3em;color:#C7CDD6}
  .shellTitle i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);
    animation:blink 2s steps(2) infinite}
  @keyframes blink{50%{opacity:.3}}
  .face{background:#000;border-radius:6px;border:3px solid #1F2226;
    box-shadow:inset 0 0 30px rgba(0,0,0,.95);padding:14px;
    background-image:radial-gradient(rgba(255,176,32,.045) 1px, transparent 1.4px);
    background-size:7px 7px}

  /* CHAMPIONS BOARD */
  #weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .wk{border:1px solid #222831;border-radius:6px;padding:10px 8px;text-align:center;background:rgba(255,255,255,.015)}
  .wk .lbl{font-family:var(--mono);font-weight:bold;font-size:11px;letter-spacing:.18em;color:#5A6470}
  .wk .dates{font-family:var(--mono);font-weight:bold;font-size:8.5px;line-height:1.5;color:#49525E;
    letter-spacing:.04em;margin-top:4px;min-height:26px}
  .wk.done .dates,.wk.now .dates{color:#6E7886}
  .wk .who{font-family:var(--mono);font-weight:bold;font-size:clamp(13px,1.5vw,18px);letter-spacing:.04em;
    margin:7px 0 3px;color:#2A3038}
  .wk .gls{font-family:var(--mono);font-weight:bold;font-size:11px;color:#2A3038}
  .wk.done .who{color:var(--amber);text-shadow:0 0 9px rgba(255,176,32,.85)}
  .wk.done .gls{color:var(--ledgreen);text-shadow:0 0 6px rgba(67,255,107,.6)}
  .wk.now{border-color:rgba(255,69,58,.6)}
  .wk.now .who{color:#FF9F0A;text-shadow:0 0 9px rgba(255,159,10,.8);animation:pulse 1.6s ease infinite}
  .wk.now .gls{color:#8A93A0}
  @keyframes pulse{50%{opacity:.55}}
  .wk.tv .lbl{color:var(--tang)}

  /* TV RACE */
  #race{margin-top:14px}
  .rrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .rname{width:92px;font-family:var(--mono);font-weight:bold;font-size:13px;letter-spacing:.04em;
    color:var(--amber);text-shadow:0 0 7px rgba(255,176,32,.7);text-align:right;flex-shrink:0;
    background:none;border:none;cursor:pointer;position:relative;padding:0;
    border-bottom:1px dotted rgba(255,176,32,.45)}
  .rname:hover,.rname:focus-visible{color:#FFD680}
  .rname:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .pop{display:none;position:absolute;left:0;bottom:130%;z-index:30;min-width:200px;text-align:left;
    background:var(--panel);border:1px solid var(--green);border-radius:8px;padding:10px 12px;
    box-shadow:0 14px 40px rgba(0,0,0,.7);cursor:default}
  .rname:hover .pop,.rname:focus-visible .pop,.rname.open .pop{display:block}
  .popT{display:block;font-family:var(--anton);font-weight:normal;font-size:12px;letter-spacing:.18em;
    color:var(--green);text-shadow:none;padding-bottom:6px}
  .popRow{display:flex;justify-content:space-between;gap:14px;font-size:12px;letter-spacing:.04em;
    color:var(--chalk);text-shadow:none;padding:2.5px 0}
  .popRow b{color:var(--ledgreen);text-shadow:0 0 5px rgba(67,255,107,.6)}
  .raceNote{text-align:center;font-family:var(--mono);font-weight:bold;font-size:10.5px;letter-spacing:.25em;
    color:#6E7886;padding-top:12px}
  .rtrack{flex:1;height:18px;border-radius:3px;background:rgba(255,255,255,.04);position:relative;overflow:visible}
  .rbar{height:100%;border-radius:3px;background:linear-gradient(90deg,#2F6E5C,var(--green));
    box-shadow:0 0 10px rgba(78,170,144,.5);min-width:4px;transition:width .8s ease;position:relative}
  .rrow.lead .rbar{background:linear-gradient(90deg,#B07400,var(--amber));box-shadow:0 0 12px rgba(255,176,32,.7)}
  .rbar .tvic{position:absolute;right:-13px;top:-6px;font-size:19px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
  .rgoals{width:34px;font-family:var(--mono);font-weight:bold;font-size:13px;color:var(--ledgreen);
    text-shadow:0 0 6px rgba(67,255,107,.6)}

  /* MATCHUPS */
  #wkTabs{display:flex;gap:6px;flex-wrap:wrap}
  #wkTabs button{background:rgba(24,65,115,.7);border:1px solid rgba(78,170,144,.6);color:var(--chalk);
    font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.08em;
    padding:6px 12px;border-radius:5px;cursor:pointer}
  #wkTabs button.on{background:var(--green);color:var(--denim)}
  #matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:12px}
  .mcard{border:1px solid #222831;border-radius:6px;background:rgba(255,255,255,.015);padding:9px 10px}
  .mhead{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-weight:bold;font-size:10.5px;letter-spacing:.12em;color:#7A8492;padding-bottom:7px}
  .badge{display:inline-flex;align-items:center;gap:5px}
  .badge.live{color:#FF453A;text-shadow:0 0 7px rgba(255,69,58,.9)}
  .badge.live b{width:8px;height:8px;border-radius:50%;background:#FF453A;box-shadow:0 0 8px #FF453A;
    animation:blink 1s steps(2) infinite}
  .badge.ft{color:var(--ledgreen);text-shadow:0 0 6px rgba(67,255,107,.7)}
  .trow{display:flex;align-items:center;gap:8px;padding:4px 0}
  .trow img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
  .tname{flex:1;min-width:0}
  .tname .nm{font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .own{display:inline-block;margin-top:2px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
    color:var(--denim);background:var(--green);border-radius:3px;padding:1px 6px}
  .own.house{background:var(--tang)}
  .tscore{font-family:var(--mono);font-weight:bold;font-size:22px;width:30px;text-align:center;color:#39414C}
  .mcard.in .tscore{color:var(--amber);text-shadow:0 0 9px rgba(255,176,32,.85)}
  .mcard.post .tscore{color:var(--chalk)}
  .mcard.post .trow.winner .tscore{color:var(--ledgreen);text-shadow:0 0 7px rgba(67,255,107,.7)}
  .mfoot{font-family:var(--mono);font-weight:bold;font-size:10.5px;color:#7A8492;padding-top:5px;letter-spacing:.06em}
  .mfoot .pts{color:var(--ledgreen);text-shadow:0 0 5px rgba(67,255,107,.5)}
  .empty{font-family:var(--mono);font-weight:bold;color:#5A6470;padding:24px;text-align:center;grid-column:1/-1}

  #footer{text-align:center;margin-top:26px;color:#8FA0BC;font-size:12px;letter-spacing:.08em;line-height:1.8}
  #footer b{color:var(--green)}

  @media (max-width:760px){
    #weeks{grid-template-columns:repeat(3,1fr)}
    .rname{width:74px;font-size:11px}
    #header img{height:40px}
  }
</style>
</head>
<body>
<div id="page">

<script>
/* ============ POOL CONFIG ============ */
const ASSIGN = {
  "DR Congo":"Doug","Iran":"Doug","Ivory Coast":"Doug","Jordan":"Doug",

  "Bosnia and Herzegovina":"Rachel","Ecuador":"Rachel","Germany":"Rachel","New Zealand":"Rachel",
  "Japan":"Sarah","Norway":"Sarah","Portugal":"Sarah","Saudi Arabia":"Sarah",
  "Mexico":"Tina","Morocco":"Tina","Qatar":"Tina","Switzerland":"Tina",
  "Colombia":"Zach","Croatia":"Zach","Spain":"Zach","Uzbekistan":"Zach",
  "France":"NEWBIE","Haiti":"NEWBIE","Iraq":"NEWBIE","Senegal":"NEWBIE",
  "Australia":"SAGE MG","Egypt":"SAGE MG","South Korea":"SAGE MG","Tunisia":"SAGE MG"
};
const PLAYERS = ["Doug","Ashlyn","Bridget","Fink","John","Mallory","Rachel","Sarah","Tina","Zach","NEWBIE","SAGE MG"];
const HOUSE = new Set(["NEWBIE","SAGE MG"]);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");
const ALIAS = {};
Object.keys(ASSIGN).forEach(t => ALIAS[norm(t)] = t);
Object.assign(ALIAS, {
  usa:"United States", unitedstates:"United States", usmnt:"United States",
  turkey:"Turkiye", turkiye:"Turkiye",
  czechrepublic:"Czechia",
  cotedivoire:"Ivory Coast", ivorycoast:"Ivory Coast",
  drcongo:"DR Congo", democraticrepublicofthecongo:"DR Congo", congodr:"DR Congo",
  southkorea:"South Korea", korearepublic:"South Korea",
  iran:"Iran", iriran:"Iran",
  bosniaandherzegovina:"Bosnia and Herzegovina", bosniaherzegovina:"Bosnia and Herzegovina",
  capeverde:"Cape Verde", caboverde:"Cape Verde",
  curacao:"Curacao"
});
const WEEKS = [
  { key:"W1", lbl:"WK 1", start:new Date(2026,5,11), end:new Date(2026,5,15), pay:"PAID MON 6/15", dates:"THU 6/11 – SUN 6/14<br>PAID MON 6/15" },
  { key:"W2", lbl:"WK 2", start:new Date(2026,5,15), end:new Date(2026,5,22), pay:"PAID MON 6/22", dates:"6/15 – 6/21<br>PAID 6/22" },
  { key:"W3", lbl:"WK 3", start:new Date(2026,5,22), end:new Date(2026,5,29), pay:"PAID MON 6/29", dates:"6/22 – 6/28<br>PAID 6/29" },
  { key:"W4", lbl:"WK 4", start:new Date(2026,5,29), end:new Date(2026,6,6), pay:"PAID MON 7/6", dates:"6/29 – 7/5<br>PAID 7/6" },
  { key:"W5", lbl:"WK 5", start:new Date(2026,6,6), end:new Date(2026,6,13), pay:"PAID MON 7/13", dates:"7/6 – 7/12<br>PAID 7/13" },
  { key:"FIN", lbl:"FINALE", start:new Date(2026,6,13), end:new Date(2026,6,20), pay:"TV NIGHT 7/20", dates:"7/13 – 7/19<br>TV NIGHT 7/20" }
];
const FEED = "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=950&dates=20260611-20260720";

/* ============ STATE ============ */
let MATCHES = [], lastOK = null, selectedWeek = null;
const $ = id => document.getElementById(id);

/* ============ DATA ============ */
function parseEvents(json){
  const out = [];
  (json.events || []).forEach(ev => {
    const c = ev.competitions && ev.competitions[0];
    if (!c || !c.competitors || c.competitors.length < 2) return;
    const home = c.competitors.find(x => x.homeAway === "home") || c.competitors[0];
    const away = c.competitors.find(x => x.homeAway === "away") || c.competitors[1];
    const mk = side => ({
      name: side.team?.displayName || "?",
      our: ALIAS[norm(side.team?.displayName || "")] || null,
      logo: side.team?.logo || "",
      score: parseInt(side.score, 10) || 0,
      winner: !!side.winner
    });
    const st = c.status || {};
    out.push({
      id: ev.id,
      date: new Date(ev.date),
      state: st.type?.state || "pre",       // pre | in | post
      detail: st.type?.shortDetail || "",
      clock: st.displayClock || "",
      home: mk(home), away: mk(away)
    });
  });
  out.sort((a, b) => a.date - b.date);
  return out;
}
async function refresh(){
  try{
    const r = await fetch(FEED, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    MATCHES = parseEvents(await r.json());
    lastOK = new Date();
    $("updated").innerHTML = "● LIVE FEED · UPDATED " + lastOK.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    renderAll();
  }catch(e){
    $("updated").innerHTML = '<span class="err">● SIGNAL LOST · RETRYING</span>' +
      (lastOK ? '<br>LAST GOOD: ' + lastOK.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "");
  }
}

/* ============ MATH ============ */
function weekOf(d){ return WEEKS.findIndex(w => d >= w.start && d < w.end); }
function goalsByPlayer(weekIdx, includeLive){
  const g = {}; PLAYERS.forEach(p => g[p] = 0);
  MATCHES.forEach(m => {
    if (weekIdx >= 0 && weekOf(m.date) !== weekIdx) return;
    if (m.state === "post" || (includeLive && m.state === "in")){
      [m.home, m.away].forEach(side => {
        if (side.our) g[ASSIGN[side.our]] += side.score;
      });
    }
  });
  return g;
}
function leaders(g){
  const max = Math.max(...PLAYERS.map(p => g[p]));
  return { max, names: PLAYERS.filter(p => g[p] === max && max > 0) };
}
function weekStatus(w){
  const now = new Date();
  if (now >= w.end) return "done";
  if (now >= w.start) return "now";
  return "future";
}

/* ============ RENDER ============ */
function renderMoney(){
  const msgs = [];
  const now = new Date();
  let latestDone = null;
  WEEKS.forEach((w, i) => {
    if (i === 5) return;
    if (weekStatus(w) === "done"){
      const L = leaders(goalsByPlayer(i, false));
      if (L.names.length) latestDone = { w, L };
    }
  });
  if (latestDone){
    const { w, L } = latestDone;
    const who = L.names.join(" & ");
    if (L.names.some(n => HOUSE.has(n))){
      msgs.push(`<span class="pay">★ ${w.lbl} GOES TO ${who.toUpperCase()} · OFFICE TREAT INCOMING 🍩</span>`);
    } else {
      msgs.push(`<span class="pay">★ EVERYONE OWES ${who.toUpperCase()} $1 · ${w.pay} · PAY UP ★</span>`);
    }
  }
  const ci = WEEKS.findIndex(w => weekStatus(w) === "now");
  if (ci >= 0){
    const L = leaders(goalsByPlayer(ci, true));
    if (L.names.length) msgs.push(`${WEEKS[ci].lbl} LIVE LEADER: <span class="gr">${L.names.join(" & ").toUpperCase()} · ${L.max} GOALS</span>`);
    else msgs.push(`${WEEKS[ci].lbl} UNDERWAY · NO GOALS YET · SOMEBODY DO SOMETHING`);
  }
  WEEKS.forEach((w, i) => {
    if (i === 5 || weekStatus(w) !== "done") return;
    const L = leaders(goalsByPlayer(i, false));
    if (L.names.length) msgs.push(`${w.lbl}: ${L.names.join(" & ").toUpperCase()} (${L.max})`);
  });
  const tot = leaders(goalsByPlayer(-1, true));
  if (tot.names.length) msgs.push(`📺 TV RACE LEADER: <span class="gr">${tot.names.join(" & ").toUpperCase()} · ${tot.max} GOALS</span>`);
  const allDone = MATCHES.length && MATCHES.every(m => m.state === "post") && now >= WEEKS[5].end;
  if (allDone && tot.names.length) msgs.unshift(`<span class="pay">🏆 THE TV GOES TO ${tot.names.join(" & ").toUpperCase()} 🏆</span>`);
  if (!msgs.length) msgs.push("THE POOL IS OPEN · GOOD LUCK EVERYBODY");
  $("moneyInner").innerHTML = msgs.join(" &nbsp;·&nbsp; ") + " &nbsp;·&nbsp; ";
}
function renderWeeks(){
  const host = $("weeks"); host.innerHTML = "";
  WEEKS.forEach((w, i) => {
    const st = weekStatus(w);
    const d = document.createElement("div");
    d.className = "wk " + (i === 5 ? "tv " : "") + (st === "done" ? "done" : st === "now" ? "now" : "");
    let who = "— — —", gls = "&nbsp;";
    if (i === 5){
      const L = leaders(goalsByPlayer(-1, true));
      const allDone = MATCHES.length && MATCHES.every(m => m.state === "post");
      if (st !== "future" && L.names.length){
        who = L.names.join("/"); gls = (allDone ? "📺 " : "LEADS · ") + L.max + " GLS";
      } else { gls = "JUL 13-19"; }
    } else if (st === "done"){
      const L = leaders(goalsByPlayer(i, false));
      who = L.names.length ? L.names.join("/") : "NO GOALS";
      gls = L.max + " GLS · $1";
    } else if (st === "now"){
      const L = leaders(goalsByPlayer(i, true));
      who = L.names.length ? L.names.join("/") : "IN PLAY";
      gls = L.names.length ? L.max + " GLS · LIVE" : "LIVE";
    }
    d.innerHTML = `<div class="lbl">${i === 5 ? "📺 " : ""}${w.lbl}</div><div class="dates">${w.dates}</div><div class="who">${who.toUpperCase()}</div><div class="gls">${gls}</div>`;
    host.appendChild(d);
  });
}
function teamGoals(){
  const tg = {}; Object.keys(ASSIGN).forEach(t => tg[t] = 0);
  MATCHES.forEach(m => {
    if (m.state === "post" || m.state === "in"){
      [m.home, m.away].forEach(s => { if (s.our) tg[s.our] += s.score; });
    }
  });
  return tg;
}
function renderRace(){
  const g = goalsByPlayer(-1, true);
  const tg = teamGoals();
  const order = [...PLAYERS].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  const max = Math.max(1, ...PLAYERS.map(p => g[p]));
  const leadSet = new Set(PLAYERS.filter(p => g[p] === max && g[p] > 0));
  const host = $("race"); host.innerHTML = "";
  order.forEach(p => {
    const row = document.createElement("div");
    row.className = "rrow" + (leadSet.has(p) ? " lead" : "");
    const pct = Math.max(2, (g[p] / max) * 100);
    const picks = Object.entries(ASSIGN).filter(([, v]) => v === p).map(([k]) => k);
    const popRows = picks.map(t => `<div class="popRow"><span>⚽ ${t.toUpperCase()}</span><b>${tg[t]}</b></div>`).join("");
    row.innerHTML = `<button class="rname" type="button">${p.toUpperCase()}
        <span class="pop"><span class="popT">${p.toUpperCase()}'S SQUAD</span>${popRows}</span>
      </button>
      <div class="rtrack"><div class="rbar" style="width:${pct}%">${leadSet.has(p) ? '<span class="tvic">📺</span>' : ""}</div></div>
      <div class="rgoals">${g[p]}</div>`;
    row.querySelector(".rname").addEventListener("click", e => {
      e.stopPropagation();
      const btn = e.currentTarget, was = btn.classList.contains("open");
      document.querySelectorAll(".rname.open").forEach(b => b.classList.remove("open"));
      if (!was) btn.classList.add("open");
    });
    host.appendChild(row);
  });
  const note = document.createElement("div");
  note.className = "raceNote";
  note.textContent = "SELECT YOUR NAME TO SEE YOUR PICKS";
  host.appendChild(note);
}
document.addEventListener("click", () => document.querySelectorAll(".rname.open").forEach(b => b.classList.remove("open")));
function roundOf(d){
  const md = (d.getMonth() + 1) * 100 + d.getDate();
  if (md <= 627) return "GROUP STAGE";
  if (md <= 703) return "ROUND OF 32";
  if (md <= 708) return "ROUND OF 16";
  if (md <= 712) return "QUARTERFINAL";
  if (md <= 716) return "SEMIFINAL";
  if (md <= 718) return "3RD PLACE";
  return "THE FINAL";
}
function fmtTime(d){
  return d.toLocaleString([], { weekday:"short", month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit" });
}
function ownChip(side){
  if (!side.our) return "";
  const p = ASSIGN[side.our];
  return `<span class="own${HOUSE.has(p) ? " house" : ""}">${p.toUpperCase()}</span>`;
}
function renderTabs(){
  const host = $("wkTabs"); host.innerHTML = "";
  WEEKS.forEach((w, i) => {
    const b = document.createElement("button");
    b.textContent = w.lbl;
    b.className = i === selectedWeek ? "on" : "";
    b.onclick = () => { selectedWeek = i; renderMatches(); renderTabs(); };
    host.appendChild(b);
  });
}
function renderMatches(){
  const host = $("matches"); host.innerHTML = "";
  $("muTitle").textContent = selectedWeek === weekOf(new Date()) ? "THIS WEEK'S MATCHUPS" : WEEKS[selectedWeek].lbl + " MATCHUPS";
  const list = MATCHES.filter(m => weekOf(m.date) === selectedWeek);
  if (!list.length){
    host.innerHTML = '<div class="empty">NO MATCHES ON THE BOARD FOR THIS WEEK YET</div>';
    return;
  }
  list.forEach(m => {
    const card = document.createElement("div");
    card.className = "mcard " + m.state;
    let badge;
    if (m.state === "in") badge = `<span class="badge live"><b></b>LIVE · ${m.clock}</span>`;
    else if (m.state === "post") badge = `<span class="badge ft">FULL TIME</span>`;
    else badge = `<span class="badge">${fmtTime(m.date).toUpperCase()}</span>`;
    const row = (s, isWin) => `
      <div class="trow${isWin ? " winner" : ""}">
        ${s.logo ? `<img src="${s.logo}" alt="">` : ""}
        <div class="tname"><div class="nm">${s.name}</div>${ownChip(s)}</div>
        <div class="tscore">${m.state === "pre" ? "–" : s.score}</div>
      </div>`;
    let foot = "";
    if (m.state === "post"){
      const bits = [m.home, m.away].filter(s => s.our && s.score > 0)
        .map(s => `<span class="pts">+${s.score} → ${ASSIGN[s.our].toUpperCase()}</span>`);
      foot = `<div class="mfoot">${bits.length ? bits.join(" · ") : "0-0 · THE RAREST RESULT NOBODY WANTED"}</div>`;
    }
    card.innerHTML = `<div class="mhead"><span>${roundOf(m.date)}</span>${badge}</div>` +
      row(m.home, m.home.winner) + row(m.away, m.away.winner) + foot;
    host.appendChild(card);
  });
}
function renderAll(){
  if (selectedWeek === null){
    const w = weekOf(new Date());
    selectedWeek = w >= 0 ? w : (new Date() < WEEKS[0].start ? 0 : 5);
  }
  renderMoney(); renderWeeks(); renderRace(); renderTabs(); renderMatches();
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
